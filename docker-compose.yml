\
version: "3.8"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/simmental_nutrition.db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
      - ENABLE_SCHEDULER=true
    volumes:
      - ./data:/app/data
      - ./examples:/app/examples
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
volumes:
  redis_data:
